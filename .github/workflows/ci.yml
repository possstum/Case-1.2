name: CI

"on":
  push:
  pull_request:

jobs:
  verified-local-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Run pytest api baseline
        run: pytest -q tests/api

      - name: Run pytest non-api baseline
        run: pytest -q tests/services tests/providers tests/db tests/utils tests/core
